<router-outlet></router-outlet>

<div class="header-section">
  <h2>Gestión de Categorías</h2>
  <button mat-fab extended color="primary" routerLink="/pages/category/new">
    <mat-icon>add_circle</mat-icon>
    Nueva Categoría
  </button>
</div>

<mat-form-field appearance="outline" class="filter-field">
  <mat-label>Buscar categoría</mat-label>
  <input matInput (keyup)="applyFilter($event)" placeholder="Ej. SUITE, MATRIMONIAL..." #input />
  <mat-icon matSuffix>search</mat-icon>
</mat-form-field>

<div class="mat-elevation-z4 table-container">
  <table mat-table [dataSource]="$dataSource()" matSort>
    <!-- Nombre -->
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Categoría</th>
      <td mat-cell *matCellDef="let row">
        <strong>{{ row.name }}</strong>
      </td>
    </ng-container>

    <!-- Descripción -->
    <ng-container matColumnDef="description">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Descripción</th>
      <td mat-cell *matCellDef="let row">{{ row.description }}</td>
    </ng-container>

    <!-- Estado -->
    <ng-container matColumnDef="status">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Estado</th>
      <td mat-cell *matCellDef="let row">
        <span class="status-badge" [class.available]="row.status" [class.occupied]="!row.status">
          {{ row.status ? 'ACTIVO' : 'INACTIVO' }}
        </span>
      </td>
    </ng-container>

    <!-- Acciones -->
    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef>Acciones</th>
      <td mat-cell *matCellDef="let row">
        <button mat-icon-button color="primary" [routerLink]="['edit', row.idCategory]" title="Editar">
          <mat-icon>edit</mat-icon>
        </button>
        <button mat-icon-button color="warn" (click)="delete(row.idCategory)" title="Eliminar">
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>

    <tr class="mat-row" *matNoDataRow>
      <td class="mat-cell" colspan="4" style="text-align: center; padding: 2rem;">
        No se encontraron categorías registradas o que coincidan con "{{ input.value }}"
      </td>
    </tr>
  </table>

  <mat-paginator [pageSizeOptions]="[5, 10, 25]" aria-label="Seleccionar página"></mat-paginator>
</div>
